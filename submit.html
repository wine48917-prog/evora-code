
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b0e">
  <title>EVORA CODE — إنشاء قالب</title>
  <link rel="stylesheet" href="submit.css">
</head>

<body>

  <main class="submit-page">

    <header class="submit-header">
      <a href="library.html" class="back-link">← المكتبة</a>
      <div class="brand">
        <span>&lt;/&gt;</span>
        <strong>EVORA CODE</strong>
      </div>
      <small>DEV BY VELOR</small>
    </header>

    <section class="submit-content">

      <h1 id="pageHeading">إنشاء قالب جديد</h1>
      <p>أنشئ مشروعك واكتب الأكواد ثم احفظه في مكتبتك.</p>

      <form id="submitForm">

        <label for="templateName">اسم القالب</label>
        <input
          id="templateName"
          type="text"
          maxlength="100"
          placeholder="مثال: موقعي الأول"
          required
        >

        <label for="description">وصف القالب</label>
        <textarea
          id="description"
          maxlength="300"
          placeholder="اكتب وصفًا مختصرًا..."
        ></textarea>

        <small>
          <span id="descCount">0</span>/300
        </small>

        <h3>طريقة كتابة المشروع</h3>

        <label>
          <input type="radio" name="status" value="split" checked>
          ملفات منفصلة HTML / CSS / JS
        </label>

        <label>
          <input type="radio" name="status" value="unified">
          ملف HTML واحد
        </label>

        <section class="code-editor">

          <nav class="code-editor__tabs">
            <button type="button" class="code-editor__tab active" data-tab="html">
              HTML
            </button>

            <button type="button" class="code-editor__tab" data-tab="css" data-split-only>
              CSS
            </button>

            <button type="button" class="code-editor__tab" data-tab="js" data-split-only>
              JavaScript
            </button>
          </nav>

          <div class="code-editor__pane" data-pane="html">
            <div id="paneHtml">
              <div id="htmlEditor"></div>
            </div>
          </div>

          <div class="code-editor__pane" data-pane="css" style="display:none">
            <div id="paneCss"></div>
          </div>

          <div class="code-editor__pane" data-pane="js" style="display:none">
            <div id="paneJs"></div>
          </div>

        </section>

        <p>عدد الأسطر: <span id="linesCount">0</span></p>

        <div class="form-actions">
          <button type="button" id="previewBtn">
            معاينة المشروع
          </button>

          <button type="submit" id="submitBtn">
            <span id="submitLabel">حفظ القالب</span>
          </button>
        </div>

      </form>

    </section>

    <footer>
      © 2026 WINE 🍷 — All Rights Reserved.
    </footer>

  </main>

  <div id="preview" class="preview-modal" style="display:none">
    <div class="preview-window">
      <header>
        <strong id="previewTitle">معاينة المشروع</strong>
        <button type="button" data-close>إغلاق</button>
      </header>

      <iframe id="previewFrame" title="Project preview"></iframe>
    </div>
  </div>

  <script type="module" src="submit.js"></script>

</body>
</html>
